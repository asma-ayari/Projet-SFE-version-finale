<div class="auth-container">
  <!-- Left Side - Form -->
  <div class="auth-form-container">
    <div class="auth-form-wrapper">
      <div class="mobile-logo">
        <a routerLink="/" class="logo">
          <div class="logo-icon">
            <i class="fas fa-shield-alt"></i>
          </div>
          <span class="logo-title">Sécurité Routière</span>
        </a>
      </div>

      <div class="form-header">
        <h2>Créer un Compte</h2>
        <p>Rejoignez notre plateforme d'apprentissage</p>
      </div>

      <!-- Error Message -->
      @if (errorMessage()) {
      <div class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i>
        {{ errorMessage() }}
      </div>
      }

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <!-- Name Fields -->
        <div class="form-row">
          <div class="form-group">
            <label for="firstName" class="form-label">Prénom</label>
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="firstName" class="form-control" placeholder="Votre prénom"
                [(ngModel)]="firstName" name="firstName" required>
            </div>
          </div>
          <div class="form-group">
            <label for="lastName" class="form-label">Nom</label>
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="lastName" class="form-control" placeholder="Votre nom"
                [(ngModel)]="lastName" name="lastName" required>
            </div>
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="exemple@email.com" [(ngModel)]="email"
              name="email" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Mot de passe</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input [type]="hidePassword() ? 'password' : 'text'" id="password" class="form-control with-toggle"
              placeholder="••••••••" [(ngModel)]="password" name="password" required>
            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
              <i [class]="hidePassword() ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input [type]="hideConfirmPassword() ? 'password' : 'text'" id="confirmPassword"
              class="form-control with-toggle" placeholder="••••••••" [(ngModel)]="confirmPassword"
              name="confirmPassword" required>
            <button type="button" class="toggle-password" (click)="toggleConfirmPasswordVisibility()">
              <i [class]="hideConfirmPassword() ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
            </button>
          </div>
        </div>

        <!-- Terms Checkbox -->
        <div class="form-group">
          <label class="checkbox-wrapper">
            <input type="checkbox" [(ngModel)]="acceptTerms" name="acceptTerms" required>
            <span class="checkmark"></span>
            Conditions d'utilisation & Politique de confidentialité
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" [class.loading]="isLoading()" [disabled]="!acceptTerms">
          @if (isLoading()) {
          <span class="spinner"></span>
          Chargement...
          } @else {
          <i class="fas fa-user-plus"></i>
          S'inscrire
          }
        </button>
      </form>

      <!-- Social Register -->
      <div class="social-divider">
        <span>ou continuer avec</span>
      </div>

      <div class="social-buttons">
        <button type="button" class="social-btn google" (click)="onGoogleRegister()">
          <i class="fab fa-google"></i>
          Google
        </button>
        <div id="google-btn-container"></div>
      </div>

      <!-- Login Link -->
      <div class="auth-footer">
        <p>Déjà inscrit? <a routerLink="/auth/login">Se connecter</a></p>
      </div>
    </div>
  </div>

  <!-- Right Side - Branding -->
  <div class="auth-branding">
    <div class="branding-content">
      <div class="branding-message">
        <h1>Commencer Maintenant</h1>
        <p>Rejoignez des milliers d'utilisateurs</p>
      </div>
      <div class="branding-stats">
        <div class="stat">
          <span class="stat-value">1500+</span>
          <span class="stat-label">Apprenants</span>
        </div>
        <div class="stat">
          <span class="stat-value">50+</span>
          <span class="stat-label">Courses</span>
        </div>
        <div class="stat">
          <span class="stat-value">95%</span>
          <span class="stat-label">Satisfaction</span>
        </div>
      </div>
    </div>
    <div class="branding-decoration">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
  </div>
</div>
