<div class="container py-4" *ngIf="loading">
    <div class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">{{ 'QCM_PANEL.TEST.LOADING' | translate }}</p>
    </div>
</div>

<div class="container py-4" *ngIf="error && !loading">
    <div class="alert alert-danger">{{ error }}</div>
    <a routerLink="/apprenant/qcm" class="btn btn-outline-secondary">{{ 'QCM_PANEL.TEST.BACK' | translate }}</a>
</div>

<div class="container-fluid py-3" *ngIf="qcm && !loading">
    <!-- Header with timer -->
    <div class="row mb-3">
        <div class="col">
            <div class="card">
                <div class="card-body py-2 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">{{ qcm.title }}</h5>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-muted small">{{ answeredCount }}/{{ qcm.questions.length }} répondu(es)</span>
                        <span class="fs-5" [ngClass]="timerClass">
                            <i class="bi bi-clock me-1"></i>{{ timerDisplay }}
                        </span>
                    </div>
                </div>
                <div class="progress" style="height: 4px;">
                    <div class="progress-bar" [style.width.%]="progress"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <!-- Question navigation sidebar -->
        <div class="col-md-3 col-lg-2">
            <div class="card">
                <div class="card-header py-2"><small class="fw-semibold">Questions</small></div>
                <div class="card-body p-2">
                    <div class="d-flex flex-wrap gap-1">
                        <button *ngFor="let q of qcm.questions; let i = index" class="btn btn-sm" [ngClass]="{
                      'btn-primary': currentIndex === i,
                      'btn-success': currentIndex !== i && isAnswered(i),
                      'btn-outline-secondary': currentIndex !== i && !isAnswered(i)
                    }" style="width: 38px;" (click)="goTo(i)">
                            {{ i + 1 }}
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Current question -->
        <div class="col-md-9 col-lg-10">
            <div class="card" *ngIf="currentQuestion">
                <div class="card-header">
                    <span class="fw-semibold">Question {{ currentIndex + 1 }} / {{ qcm.questions.length }}</span>
                </div>
                <div class="card-body">
                    <p class="fs-5 mb-4">{{ currentQuestion.text }}</p>

                    <div class="list-group">
                        <button *ngFor="let a of currentQuestion.answers; let ai = index"
                            class="list-group-item list-group-item-action d-flex align-items-center"
                            [class.active]="isSelected(currentQuestion.id!, a.id!)"
                            (click)="selectAnswer(currentQuestion.id!, a.id!)">
                            <span class="badge rounded-pill me-3"
                                [ngClass]="isSelected(currentQuestion.id!, a.id!) ? 'bg-white text-primary' : 'bg-secondary'">
                                {{ ['A','B','C','D','E','F'][ai] }}
                            </span>
                            {{ a.text }}
                        </button>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button class="btn btn-outline-secondary" (click)="prev()" [disabled]="currentIndex === 0">
                        <i class="bi bi-chevron-left me-1"></i>Précédent
                    </button>

                    <button *ngIf="currentIndex < qcm.questions.length - 1" class="btn btn-primary" (click)="next()">
                        Suivant<i class="bi bi-chevron-right ms-1"></i>
                    </button>

                    <button *ngIf="currentIndex === qcm.questions.length - 1" class="btn btn-success" (click)="submit()"
                        [disabled]="submitting">
                        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                        <i class="bi bi-check-lg me-1" *ngIf="!submitting"></i>
                        {{ submitting ? 'Envoi…' : 'Terminer le quiz' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Widget Chatbot -->
<app-chatbot-widget></app-chatbot-widget>
