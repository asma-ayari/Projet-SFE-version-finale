<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi me-2" [ngClass]="editMode ? 'bi-pencil-square' : 'bi-plus-circle'"></i>{{ editMode ? 'Modifier
            le QCM' : 'Créer un QCM' }}</h2>
        <a routerLink="/admin/qcm" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
    </div>

    <div *ngIf="error" class="alert alert-danger alert-dismissible fade show">
        {{ error }}
        <button type="button" class="btn-close" (click)="error=''"></button>
    </div>

    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Chargement du QCM...</p>
    </div>

    <div *ngIf="!loading">

        <!-- Meta -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Informations générales</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Titre *</label>
                        <input type="text" class="form-control" [(ngModel)]="title"
                            placeholder="Ex: QCM Signalisation routière">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="2" [(ngModel)]="description"
                            placeholder="Description optionnelle"></textarea>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Catégorie</label>
                        <select class="form-select" [(ngModel)]="category">
                            <option *ngIf="categories.length === 0" value="">Aucune categorie</option>
                            <option *ngFor="let cat of categories" [value]="cat.slug">
                                {{ cat.name }}{{ cat.is_active ? '' : ' (desactivee)' }}
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Difficulté</label>
                        <select class="form-select" [(ngModel)]="difficulty">
                            <option value="facile">Facile</option>
                            <option value="moyen">Moyen</option>
                            <option value="difficile">Difficile</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Durée (min)</label>
                        <input type="number" class="form-control" [(ngModel)]="duration_minutes" min="1" max="120">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Score min. (%)</label>
                        <input type="number" class="form-control" [(ngModel)]="pass_score" min="0" max="100">
                    </div>
                </div>
            </div>
        </div>

        <!-- Questions -->
        <div class="card mb-3" *ngFor="let q of questions; let qi = index">
            <div class="card-header d-flex justify-content-between align-items-center bg-light">
                <h6 class="mb-0">Question {{ qi + 1 }}</h6>
                <button class="btn btn-sm btn-outline-danger" (click)="removeQuestion(qi)" *ngIf="questions.length > 1">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" class="form-control" [(ngModel)]="q.text" placeholder="Texte de la question *">
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control form-control-sm" [(ngModel)]="q.explanation"
                        placeholder="Explication (affichée après correction)">
                </div>

                <!-- Answers -->
                <label class="form-label small text-muted">Réponses (cochez la bonne réponse)</label>
                <div class="input-group mb-2" *ngFor="let a of q.answers; let ai = index">
                    <div class="input-group-text">
                        <input type="radio" [name]="'correct_' + qi" [checked]="a.is_correct"
                            (change)="setCorrect(qi, ai)">
                    </div>
                    <input type="text" class="form-control" [(ngModel)]="a.text" [placeholder]="'Réponse ' + (ai + 1)">
                    <button
                        type="button"
                        class="btn btn-sm qcm-answer-delete-btn"
                        (click)="removeAnswer(qi, ai)"
                        *ngIf="q.answers.length > 2"
                        aria-label="Supprimer la réponse"
                        title="Supprimer"
                    >
                        <i class="bi bi-trash" aria-hidden="true"></i>
                    </button>
                </div>
                <button class="btn btn-sm btn-outline-secondary" (click)="addAnswer(qi)" *ngIf="q.answers.length < 6">
                    <i class="bi bi-plus me-1"></i>Ajouter une réponse
                </button>
            </div>
        </div>

        <button class="btn btn-outline-primary mb-4" (click)="addQuestion()">
            <i class="bi bi-plus-lg me-1"></i>Ajouter une question
        </button>

        <!-- Submit -->
        <div class="d-flex justify-content-end gap-2">
            <a routerLink="/admin/qcm" class="btn btn-secondary">Annuler</a>
            <button class="btn btn-primary" (click)="save()" [disabled]="saving">
                <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
                {{ saving ? 'Enregistrement…' : (editMode ? 'Modifier le QCM' : 'Créer le QCM') }}
            </button>
        </div>
    </div>
</div>
