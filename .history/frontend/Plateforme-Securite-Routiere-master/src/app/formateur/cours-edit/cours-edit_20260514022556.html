<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-pencil-square me-2"></i>{{ 'FORMATEUR.COURS_EDIT.TITLE' | translate }}</h2>
        <div class="action-buttons">
      <button (click)="viewCourse()" class="btn btn-outline-info me-2" [title]="'FORMATEUR.COURS_EDIT.VIEW_TITLE' | translate">
        <i class="fas fa-eye me-1"></i>{{ 'FORMATEUR.COURS_EDIT.VIEW' | translate }}
            </button>
            <button (click)="goBack()" class="btn btn-outline-danger">
        <i class="fas fa-arrow-left me-1"></i>{{ 'FORMATEUR.COURS_EDIT.BACK' | translate }}
            </button>
        </div>
    </div>

    @if (isLoading()) {
      <div class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-3">{{ 'FORMATEUR.COURS_EDIT.LOADING' | translate }}</p>
      </div>
    }

    @if (error()) {
      <div class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-circle me-2"></i>{{ error() }}<button type="button" class="btn-close" (click)="error.set('')"></button>
      </div>
    }
    @if (success()) {
      <div class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i>{{ success() }}<button type="button" class="btn-close" (click)="success.set('')"></button>
      </div>
    }

    @if (course() && !isLoading()) {
      <div class="card">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">{{ 'FORMATEUR.COURS_EDIT.FORM.TITLE' | translate }}</label>
              <input type="text" class="form-control" [(ngModel)]="course()!.title">
            </div>
            <div class="col-12">
              <label class="form-label">{{ 'FORMATEUR.COURS_EDIT.FORM.DESCRIPTION' | translate }}</label>
              <textarea class="form-control" rows="2" [(ngModel)]="course()!.description"></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">{{ 'FORMATEUR.COURS_EDIT.FORM.CATEGORY' | translate }}</label>
              <select class="form-select" [(ngModel)]="course()!.category">
                <option value="conduite">{{ 'FORMATEUR.COURS_EDIT.CATEGORIES.CONDUITE' | translate }}</option>
                <option value="securite">{{ 'FORMATEUR.COURS_EDIT.CATEGORIES.SECURITE' | translate }}</option>
                <option value="secours">{{ 'FORMATEUR.COURS_EDIT.CATEGORIES.SECOURS' | translate }}</option>
                <option value="signalisation">{{ 'FORMATEUR.COURS_EDIT.CATEGORIES.SIGNALISATION' | translate }}</option>
                <option value="general">{{ 'FORMATEUR.COURS_EDIT.CATEGORIES.GENERAL' | translate }}</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">{{ 'FORMATEUR.COURS_EDIT.FORM.DURATION' | translate }}</label>
              <input type="text" class="form-control" [(ngModel)]="course()!.duration">
            </div>
            <div class="col-md-6">
              <label class="form-label">{{ 'FORMATEUR.COURS_EDIT.FORM.IMAGE_URL' | translate }}</label>
              <input type="text" class="form-control" [(ngModel)]="course()!.image_url">
            </div>
            <div class="col-md-6">
              <label class="form-label">{{ 'FORMATEUR.COURS_EDIT.FORM.VIDEO_URL' | translate }}</label>
              <input type="text" class="form-control" [(ngModel)]="course()!.video_url">
            </div>
            <div class="col-12">
              <label class="form-label">{{ 'FORMATEUR.COURS_EDIT.FORM.CONTENT' | translate }}</label>
              <textarea class="form-control" rows="12" [(ngModel)]="course()!.content"></textarea>
            </div>
          </div>
        </div>
        <div class="card-footer d-flex justify-content-end gap-2">
          <button (click)="goBack()" class="btn btn-secondary">{{ 'FORMATEUR.COURS_EDIT.ACTIONS.CANCEL' | translate }}</button>
          <button class="btn btn-primary" (click)="save()" [disabled]="isSaving()">
            @if (isSaving()) {
              <span class="spinner-border spinner-border-sm me-1"></span>
            }
            {{ isSaving() ? ('FORMATEUR.COURS_EDIT.ACTIONS.SAVING' | translate) : ('FORMATEUR.COURS_EDIT.ACTIONS.SAVE' | translate) }}
          </button>
        </div>
      </div>
    }
</div>
