<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-pencil-square me-2"></i>Modifier le cours</h2>
        <div class="action-buttons">
            <button (click)="viewCourse()" class="btn btn-outline-info me-2" title="Voir en mode lecture">
                <i class="fas fa-eye me-1"></i>Voir
            </button>
            <button (click)="goBack()" class="btn btn-outline-danger">
                <i class="fas fa-arrow-left me-1"></i>Retour
            </button>
        </div>
    </div>

    @if (isLoading()) {
      <div class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-3">Chargement du cours...</p>
      </div>
    }

    @if (error()) {
      <div class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-circle me-2"></i>{{ error() }}<button type="button" class="btn-close" (click)="error.set('')"></button>
      </div>
    }
    @if (success()) {
      <div class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i>{{ success() }}<button type="button" class="btn-close" (click)="success.set('')"></button>
      </div>
    }

    @if (course() && !isLoading()) {
      <div class="card">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Titre *</label>
              <input type="text" class="form-control" [(ngModel)]="course()!.title">
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="2" [(ngModel)]="course()!.description"></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">Catégorie</label>
              <select class="form-select" [(ngModel)]="course()!.category">
                <option value="conduite">Conduite</option>
                <option value="securite">Sécurité</option>
                <option value="secours">Premiers secours</option>
                <option value="signalisation">Signalisation</option>
                <option value="general">Général</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Durée</label>
              <input type="text" class="form-control" [(ngModel)]="course()!.duration">
            </div>
            <div class="col-md-6">
              <label class="form-label">URL image</label>
              <input type="text" class="form-control" [(ngModel)]="course()!.image_url">
            </div>
            <div class="col-md-6">
              <label class="form-label">URL vidéo</label>
              <input type="text" class="form-control" [(ngModel)]="course()!.video_url">
            </div>
            <div class="col-12">
              <label class="form-label">Contenu du cours</label>
              <textarea class="form-control" rows="12" [(ngModel)]="course()!.content"></textarea>
            </div>
          </div>
        </div>
        <div class="card-footer d-flex justify-content-end gap-2">
          <button (click)="goBack()" class="btn btn-secondary">Annuler</button>
          <button class="btn btn-primary" (click)="save()" [disabled]="isSaving()">
            @if (isSaving()) {
              <span class="spinner-border spinner-border-sm me-1"></span>
            }
            {{ isSaving() ? 'Enregistrement…' : 'Enregistrer' }}
          </button>
        </div>
      </div>
    }
</div>
